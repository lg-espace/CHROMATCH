<!DOCTYPE html>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    /* Page 404 sur GitHub Pages : on corrige les liens relatifs quel que soit le chemin demandé.
       Site de projet (https://pseudo.github.io/depot/...) : base = /depot/ ; sinon base = / .
       Si votre site est à la racine (depot nommé pseudo.github.io), remplacez BASE par '/'. */
    (function () {
      var BASE = null;
      var p = location.pathname.split('/').filter(Boolean);
      if (BASE === null) BASE = (/\.github\.io$/.test(location.hostname) && p.length) ? '/' + p[0] + '/' : '/';
      document.write('<base href="' + BASE + '">');
    })();
  </script>
